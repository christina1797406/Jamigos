<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamigos - User Profile</title>
    <link rel="stylesheet" href="profile.css">
    <script defer src="profile.js"></script>
</head>

<body>
    <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="logo">Jamigos<span class="purple-dot">.</span></h2>
    <nav>
      <ul>
        <li>Home</li>
        <li>Browse</li>
        <li>My Playlists</li>
        <li>Friends' Activity</li>
        <li>Karaoke Rooms</li>
        <li>Now Playing</li>
        <li>Settings</li>
      </ul>
    </nav>
  </aside>

      <main class="profile-page">
        <section class="profile-header">
          <img src="assets/profile.jpg" class="avatar" alt="Profile Picture">
          <div class="user-info">
            <h2>User123</h2>
            <p>user123@gmail.com</p>
            <span>10 Followers · 10 Following</span>
            <div class="profile-actions">
              <button type="button">Edit Profile</button>
              <button type="button">🔗</button>
              <button type="button">⋯</button>
            </div>
          </div>
        </section>

        <div class="tabs">
          <button type="button" class="active">My Playlists</button>
          <button type="button">Favorites</button>
          <button type="button">Recently Played</button>
          <button type="button">My Karaoke Moments</button>
        </div>

        <section class="playlists">
          <!-- JS will populate this -->
        </section>
      </main>
  </body>
  </html>
