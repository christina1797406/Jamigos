<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamigos | Mood Board</title>
    <link rel="stylesheet" href='stylesheets/moodboard.css'>
</head>
<body>
    <div class="container">
        <header>
            <h1>What are you in the mood for?</h1>
            <p>Select to start your Jam experience</p>
        </header>
        <section class = "mood-grid">
            <div class="mood-card happy" data-mood="happy">😊<span>Happy</span></div>
            <div class = "mood-card chill" data-mood="chill">🌙<span>Chill</span></div>
            <div class = "mood-card energetic" data-mood="energetic">⚡<span>Energetic</span></div>
            <div class = "mood-card sad" data-mood="sad">😭<span>Sad</span></div>
            <div class = "mood-card romantic" data-mood="romantic">❤️<span>Romantic</span></div>
            <div class = "mood-card focus" data-mood="focus">🎧<span>Focus</span></div>
            <div class = "mood-card confident" data-mood="confident">😎<span>Confident</span></div>
            <div class = "mood-card nostalgic" data-mood="nostalgic">📻<span>Nostalgic</span></div>
            <div class = "mood-card dreamy" data-mood="dreamy">☁️<span>Dreamy</span></div>
            <div class = "mood-card angry" data-mood="angry">😡<span>Angry</span></div>
            <div class = "mood-card peaceful" data-mood="peaceful">🧘<span>Peaceful</span></div>
            <div class = "mood-card adventurous" data-mood="adventurous">🌄<span>Adventurous</span></div>
            <div class = "mood-card sporty" data-mood="sporty">🏃<span>Sporty</span></div>
            <div class = "mood-card bored" data-mood="bored">🥱<span>Bored</span></div>
            <div class = "mood-card downbeat" data-mood="downbeat">👎<span>Downbeat</span></div>
            <div class = "mood-card hyper" data-mood="hyper">😜<span>Hyper</span></div>
            <div class = "mood-card positive" data-mood="positive">✅<span>Positive</span></div>
        </section>
        <footer class = "footerbtns">
            <button type="button" class="theme-toggle" onclick="toggleTheme()">🌗 Toggle Theme</button>
            <button type = "button" class = "generate-playlist" onclick="generatePlaylist()"> Generate Playlist</button>
        </footer>
        <div id = "playlistModal" class = "modal hidden">
            <div class = "playlistModal-window">
                <div class = "playlistModal-header">
                    <input type = "text" class = "playlist-title" id = "playlistTitle" />
                    <button type = "button" class = "close-button" onclick="closePlaylist()">X</button>
                </div>
                <div class = "playlistModal-body">
                    <div class="song-list" id="songList"></div>
                </div>
                <div class = "playlistModal-footer">
                    <!--moreAongsBtn doesnt have an onclick event attached to it as it will use the same onclick event -->
                    <button type = "button" class = "moreSongsBtn" id = "moreSongsBtn">Add more songs</button>
                    <button type = "button" class = "savePlaylist" id = "savePlaylistBtn" onclick = "savePlaylist()">Save Playlist</button>
                </div>
            </div>
        </div>
    </div>
    <script src = "javascripts/moodscript.js" defer></script>
</body>
</html>
